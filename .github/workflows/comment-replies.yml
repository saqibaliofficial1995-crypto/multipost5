name: Comment Replies

on:
  schedule:
    - cron: "30 16 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode without posting replies"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: multipost5-replies
  cancel-in-progress: false

jobs:
  comments:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Runner public IP
        run: |
          echo "Runner public IP: $(curl -s https://api.ipify.org)"

      - name: Run Comment Responder
        env:
          PYTHONPATH: .
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          fi
          python -u src/comments.py $ARGS

      - name: Commit comment state
        if: always()
        run: |
          git config user.name "saqibaliofficial1995-crypto"
          git config user.email "saqibaliofficial1995@gmail.com"
          git add state/
          git diff --staged --quiet || (git commit -m "chore: update replied comments state [skip ci]" && git push)
